services:
  zookeeper-user:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    container_name: zookeeper-user
    networks:
      - raijmobi-network

  kafka-user:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper-user
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-user:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-user:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    container_name: kafka-user
    networks:
      - raijmobi-network

  redis-user:
    image: redis:alpine
    container_name: redis-user
    ports:
      - "6379:6379"
    networks:
      - raijmobi-network

  postgres-user:
    image: postgres:15
    container_name: postgres-user
    environment:
      POSTGRES_DB: ${DB_NAME:-raijmobi_user_db}
      POSTGRES_USER: ${DB_USER:-raijmobi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raijmobi_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - raijmobi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raijmobi_user} -d ${DB_NAME:-raijmobi_user_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        python manage.py makemigrations user_service --noinput &&
        python manage.py migrate &&
        python manage.py migrate easyaudit --noinput &&   
        python manage.py createsuperuser --noinput || true &&
        python manage.py collectstatic --noinput &&
        uvicorn core.asgi:application --host 0.0.0.0 --port 8000
      "
    ports:
      - "8003:8000"
    environment:
      - GOOGLE_CLIENT_ID=fake-google-client-id
      - KAFKA_BOOTSTRAP_SERVERS=kafka-user:9092
      - ALLOWED_HOSTS=*
      - DJANGO_SUPERUSER_EMAIL=pablo.murilo10@hotmail.com
      - DJANGO_SUPERUSER_NOME=Admin
      - DJANGO_SUPERUSER_PASSWORD=am@21star
      - CELERY_BROKER_URL=redis://redis-user:6379/0
      - RESEND_API_KEY=sua_chave_do_resend_aqui
      # Configurações do PostgreSQL
      - DB_NAME=${DB_NAME:-raijmobi_user_db}
      - DB_USER=${DB_USER:-raijmobi_user}
      - DB_PASSWORD=${DB_PASSWORD:-raijmobi_pass}
      - DB_HOST=postgres-user
      - DB_PORT=5432
    depends_on:
      kafka-user:
        condition: service_started
      redis-user:
        condition: service_started
      postgres-user:
        condition: service_healthy
    container_name: user-service
    networks:
      - raijmobi-network

  celery-worker-user:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core worker --loglevel=info
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-user:9092
      - ALLOWED_HOSTS=*
      - CELERY_BROKER_URL=redis://redis-user:6379/0
      - RESEND_API_KEY=re_6iH6dPfU_BcvypGyFpgaQkqvH6AzhuAd9
      # Configurações do PostgreSQL
      - DB_NAME=${DB_NAME:-raijmobi_user_db}
      - DB_USER=${DB_USER:-raijmobi_user}
      - DB_PASSWORD=${DB_PASSWORD:-raijmobi_pass}
      - DB_HOST=postgres-user
      - DB_PORT=5432
    depends_on:
      kafka-user:
        condition: service_started
      redis-user:
        condition: service_started
      postgres-user:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - raijmobi-network

  maintenance-cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: maintenance-cron
    environment:
      - DB_NAME=${DB_NAME:-raijmobi_user_db}
      - DB_USER=${DB_USER:-raijmobi_user}
      - DB_PASSWORD=${DB_PASSWORD:-raijmobi_pass}
      - DB_HOST=postgres-user
      - DB_PORT=5432
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - raijmobi-network
    volumes:
      - ./db_scripts:/scripts   # (opcional) para facilitar edição sem rebuild
      - maintenance-logs:/var/log   # (opcional) persistir logs

volumes:
  postgres_data:
  maintenance-logs:   

networks:
  raijmobi-network:
    external: true